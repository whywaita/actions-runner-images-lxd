name: debug - resolute container network

# TEMPORARY diagnostic workflow. Not for merge.
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: whywaita/setup-lxd@v1
      - name: Clear duplicate entry in nftables (same as build workflows)
        shell: bash
        run: |
          sudo nft flush ruleset
          sudo systemctl restart snap.lxd.daemon
      - name: Launch noble and resolute containers and poll them
        shell: bash
        run: |
          lxc launch ubuntu:noble probe-noble
          lxc launch ubuntu:resolute probe-resolute
          for i in 1 2 3 4 5 6; do
            echo "===== round $i $(date -u +%T)"
            for c in probe-noble probe-resolute; do
              echo "--- $c"
              lxc exec "$c" -- sh -c '
                echo -n "resolv.conf: "; grep -E "nameserver" /etc/resolv.conf | tr "\n" " "; echo
                echo -n "addr: "; ip -4 addr show eth0 2>/dev/null | grep -w inet | tr -s " " | cut -d" " -f2-
                echo -n "route: "; ip route 2>/dev/null | head -2 | tr "\n" " "; echo
                echo -n "resolved: "; resolvectl status 2>&1 | grep -E "Current DNS Server|DNS Servers|DNS Domain|resolv.conf mode" | tr -s " " | tr "\n" "|"; echo
                echo -n "units: "; systemctl is-active systemd-resolved systemd-networkd 2>&1 | tr "\n" " "; echo
                echo -n "getent: "; getent hosts archive.ubuntu.com >/dev/null 2>&1 && echo OK || echo FAIL
              ' || echo "exec failed"
            done
            sleep 10
          done
      - name: apt-get update inside both containers
        if: always()
        shell: bash
        run: |
          for c in probe-noble probe-resolute; do
            echo "===== $c apt-get update"
            lxc exec "$c" -- apt-get update 2>&1 | tail -4 || true
          done
      - name: Host side facts
        if: always()
        shell: bash
        run: |
          echo "===== lxdbr0"
          lxc network show lxdbr0 || true
          echo "===== host resolv.conf"
          cat /etc/resolv.conf || true
          echo "===== apparmor denials (dmesg)"
          sudo dmesg | grep -i -E "apparmor|denied" | tail -20 || true
          echo "===== container logs"
          for c in probe-noble probe-resolute; do echo "--- $c"; lxc info "$c" --show-log 2>&1 | tail -20; done
